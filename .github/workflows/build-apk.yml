name: Build and Release Streaker APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Rename APK for Release
      run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Streaker.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Streaker v1.0.0 - Hazır APK"
        body: |
          ### ⚡ Streaker v1.0.0
          TikTok ve Whee için otomatik seri mesajlaşma uygulaması.
          
          Aşağıdaki **Streaker.apk** dosyasını doğrudan telefonunuza indirip kurabilirsiniz!
        files: app/build/outputs/apk/debug/Streaker.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
